name: Discord notify — CI failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set, skipping."
            exit 0
          fi

          SHORT_SHA="${HEAD_SHA:0:7}"
          export SHORT_SHA

          # Try to find an open PR for this branch for extra context (best effort).
          PR_LINE=""
          GH_TOKEN="${{ secrets.PERSONAL_GH_TOKEN }}"
          if [ -n "$GH_TOKEN" ]; then
            PR_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO}/pulls?head=${{ github.repository_owner }}:${HEAD_BRANCH}&state=open")
            PR_NUM=$(echo "$PR_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null || echo "")
            if [ -n "$PR_NUM" ]; then
              PR_LINE="PR #${PR_NUM}"
            fi
          fi
          export PR_LINE

          PAYLOAD=$(python3 - <<PYEOF
          import json, os
          desc = f"Branch **{os.environ['HEAD_BRANCH']}** @ \`{os.environ.get('SHORT_SHA','')}\`"
          pr_line = os.environ.get('PR_LINE', '')
          if pr_line:
              desc += f"\n{pr_line}"
          print(json.dumps({
              "embeds": [{
                  "title": "❌ CI failed",
                  "url": os.environ['RUN_URL'],
                  "color": 15158332,
                  "description": desc
              }]
          }))
          PYEOF
          )

          curl -s -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
