<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tilemap-io</title>
    <style>
      /* Dark-mode overrides. Higher-specificity attribute selectors so they
         win the cascade regardless of when style.css gets injected. */
      body[data-theme="dark"] {
        background: #060608;
        color: #d8d8e4;
      }
      body[data-theme="dark"] p {
        color: #7d7d92;
      }
      #theme-toggle-button,
      #reset-button,
      #mute-toggle-button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 4px;
        border: 1px solid #555;
        background: #2c2c3a;
        color: inherit;
        cursor: pointer;
      }
      body[data-theme="dark"] #theme-toggle-button,
      body[data-theme="dark"] #reset-button,
      body[data-theme="dark"] #mute-toggle-button {
        background: #15151f;
        border-color: #333;
      }
      #controls {
        display: flex;
        gap: 8px;
      }
      #help-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
      }
      #help-overlay-content {
        background: #1a1a2e;
        color: #fff;
        padding: 20px 24px;
        border-radius: 8px;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <h1>tilemap-io</h1>
    <p>Click a piece, then click an adjacent tile to move it.</p>
    <p id="move-counter">Moves: 0</p>
    <p id="difficulty-badge">Difficulty: Easy</p>
    <p id="piece-count">P1: 1  P2: 1  P3: 1  P4: 1</p>
    <p id="total-pieces">Pieces remaining: 4</p>
    <div id="controls">
      <button id="reset-button" type="button">Reset</button>
      <button id="theme-toggle-button" type="button">Dark mode</button>
      <button id="mute-toggle-button" type="button">Mute</button>
    </div>
    <div id="app"></div>
    <section id="move-history">
      <h2>Move History</h2>
      <ol id="move-history-list"></ol>
    </section>
    <div id="help-overlay" hidden>
      <div id="help-overlay-content">
        <h2>Keyboard shortcuts</h2>
        <ul>
          <li><kbd>?</kbd> &mdash; toggle this help overlay</li>
        </ul>
        <button type="button" data-help-close>Close</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
